# Modo de desenvolvimento. O Docker Compose carrega este arquivo automaticamente
# junto com o docker-compose.yml. Em produção, use: docker compose -f docker-compose.yml up -d
#
# - O código do projeto é espelhado dentro dos containers (sem rebuild a cada edição).
# - O Vite roda em container próprio com hot reload (http://localhost:5173).
# - APP_ENV=local e APP_DEBUG=true sobrepõem os valores do .env.docker.

x-dev: &dev
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    LOG_CHANNEL: stderr
  volumes:
    - .:/var/www/html
    # O vendor fica num volume do Docker: ler milhares de arquivos pequenos de uma
    # pasta do Windows espelhada é ~160x mais lento e deixava a aplicação inutilizável.
    - vendor:/var/www/html/vendor
    - ./docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

services:
  app:
    <<: *dev

  queue:
    <<: *dev

  scheduler:
    <<: *dev

  vite:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_DOCKER: "true"
    command: sh -c "[ -d node_modules/.bin ] || npm ci || npm install; npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - vendor:/app/vendor

volumes:
  node_modules:
  vendor:
